name: "CI"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # =========================
  # Test & Coverage
  # =========================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Go 1.23.4
        run: |
          curl -LO https://golang.org/dl/go1.23.4.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go1.23.4.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          go version

      - name: Run tests (ignore failures)
        run: |
          go test -v -coverprofile=profile.cov ./... || true

      - name: go vet (ignore failures)
        run: |
          go vet ./... || true

      - name: Generate HTML report
        run: |
          go tool cover -html=profile.cov -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  # =========================
  # Build Linux amd64 Binary
  # =========================
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set build time
        run: |
          echo BUILD_TIME=$(date --rfc-3339=seconds) >> $GITHUB_ENV

      - name: Build Linux amd64 binary in Rocky Linux 8 Docker
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            -e BUILD_TIME="${BUILD_TIME}" \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            rockylinux:8 bash -e << 'EOF'

              echo "BUILD_TIME=$BUILD_TIME"
              echo "GITHUB_SHA=$GITHUB_SHA"

              # 基础工具
              dnf install -y epel-release curl tar xz make gcc gcc-c++ git

              # 安装静态 FFmpeg
              curl -LO https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
              tar -xf ffmpeg-release-amd64-static.tar.xz
              cp ffmpeg-*/ffmpeg /usr/local/bin/
              cp ffmpeg-*/ffprobe /usr/local/bin/

              # 安装 Go 1.23.4
              curl -LO https://golang.org/dl/go1.23.4.linux-amd64.tar.gz
              rm -rf /usr/local/go
              tar -C /usr/local -xzf go1.23.4.linux-amd64.tar.gz
              export PATH=/usr/local/go/bin:$PATH
              go version

              # Go 依赖
              go mod tidy
              go mod download

              # ldflags（最终稳定写法）
              LDFLAGS="
                -w -s
                -X github.com/cnxysoft/DDBOT-WSa/lsp.BuildTime=$BUILD_TIME
                -X github.com/cnxysoft/DDBOT-WSa/lsp.CommitId=$GITHUB_SHA
              "

              echo "LDFLAGS=$LDFLAGS"

              # 构建
              GOOS=linux GOARCH=amd64 \
              go build -buildvcs=false \
                -ldflags "$LDFLAGS" \
                -o DDBOT \
                ./cmd
EOF

      - name: Upload Linux amd64 binary
        uses: actions/upload-artifact@v4
        with:
          name: linux_amd64
          path: ./DDBOT
